<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EMIT device example</title>
  </head>
  <body>
    <h1>EMIT device example</h1>
    <p>Connect a device to inspect its card readings and status messages.</p>
    <button id="connect-250">Connect 250</button>
    <button id="disconnect-250" disabled>Disconnect 250</button>
    <button id="connect-mtr4">Connect MTR4</button>
    <button id="disconnect-mtr4" disabled>Disconnect MTR4</button>
    <button id="connect-escan">Connect eScan</button>
    <button id="disconnect-escan" disabled>Disconnect eScan</button>
    <button id="connect-escan2">Connect eScan2</button>
    <button id="disconnect-escan2" disabled>Disconnect eScan2</button>
    <button id="escan2-today" disabled>eScan2: spool today</button>
    <button id="escan2-all" disabled>eScan2: spool all</button>
    <button id="escan2-stop" disabled>eScan2: stop spool</button>
    <p id="connection-status" role="status"></p>
    <h2>Card readings</h2>
    <p id="last-read-device"></p>
    <table>
      <thead>
        <tr>
          <th>Card number</th>
          <th>Production year</th>
          <th>Production week</th>
          <th>Control codes</th>
        </tr>
      </thead>
      <tbody id="emit-card-list-body"></tbody>
    </table>
    <h2>Last MTR4 status</h2>
    <dl id="last-mtr4-status"></dl>
    <h2>Last eScan status</h2>
    <dl id="last-escan-status"></dl>
    <h2>Last eScan2 status</h2>
    <dl id="last-escan2-status"></dl>
    <h2>Last eScan2 passing</h2>
    <dl id="last-escan2-passing"></dl>
    <script type="module" src="/helper.ts"></script>
  </body>
</html>
